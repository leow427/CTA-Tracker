; The LED bridge: a spare ESP32-S3 dev board by the route LED board that fetches the dock's LED state over Wi-Fi
; (GET /leds) and drives the 21 LEDs itself, in case the dock's own LED wire fails. See README.md. Needs
; firmware/secrets.h (git-ignored) with DOCK_WIFI_* and/or WIFI_SSID / WIFI_PASS. Any S3 board: 4 MB flash, no PSRAM.
[platformio]
default_envs = ledbridge
; The dock's PlatformIO folder: the same platform, already downloaded. Don't build this and the dock at once.
core_dir = ~/.platformio-dock
; ESP-IDF refuses a build folder whose path has a space, and the repo's folder ("Final Project") has one.
build_dir = ~/.platformio-ledbridge/build

[env:ledbridge]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 1966080   ; one OTA slot (partitions.csv)
board_build.partitions = partitions.csv
board_build.flash_mode = dio
build_flags =
  -std=gnu++17
  -I../   ; firmware/, for secrets.h (git-ignored)
build_unflags =
  -std=gnu++11
  -std=gnu++2b
lib_extra_dirs = ../lib
monitor_speed = 115200
