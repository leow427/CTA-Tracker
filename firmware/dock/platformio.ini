[platformio]
default_envs = dock   ; `pio run` builds the firmware; the preview runs with -e preview

; Dock: Waveshare ESP32-S3-Touch-LCD-4.3 (ESP32-S3-WROOM-1-N8R8: 8 MB flash, 8 MB octal PSRAM).
[env:dock]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
monitor_speed = 115200
lib_extra_dirs = ../lib
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    lvgl/lvgl@9.2.2
    h2zero/NimBLE-Arduino@2.3.6
    adafruit/Adafruit NeoPixel@1.15.1
build_flags =
    -std=gnu++17
    -I..
    -Iinclude
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_flags = -Wall -Wextra
build_unflags = -std=gnu++11

; Laptop preview of the real UI code: cd firmware/dock && pio run -e preview -t exec (writes preview/out/*.png)
[env:preview]
platform = native
lib_extra_dirs = ../lib
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    lvgl/lvgl@9.2.2
lib_ignore = cta_net
build_src_filter = -<*> +<ui.cpp> +<picker.cpp> +<state.cpp> +<lv_mem_psram.c> +<../preview/preview.cpp>
build_flags =
    -std=gnu++17
    -Iinclude
    -Isrc
    -Ipreview/shim
    -DLV_CONF_INCLUDE_SIMPLE
    -lz
build_unflags = -std=gnu++11
