; The dock on the Waveshare ESP32-S3-Touch-LCD-4.3 (ESP32-S3-WROOM-1-N8R8: 8 MB flash, 8 MB octal PSRAM): the
; mockup's screens (docs/ideas/2026-11-11-dock-ui-mockup.html) in portrait, live CTA data over Wi-Fi, and the 3 LED
; rows. Needs firmware/secrets.h (git-ignored) with the CTA keys and DOCK_WIFI_SSID / DOCK_WIFI_PASS.
; Build and flash: pio run -t upload --upload-port <the CH343 port>; serial on that port at 115200. Laptop previews:
; see tools/preview.cpp.
[platformio]
default_envs = dock
; Its own PlatformIO folder, so the dock's and the handheld's builds never download into the same one at once.
core_dir = ~/.platformio-dock
; ESP-IDF refuses a build folder whose path has a space, and the repo's folder ("Final Project") has one.
build_dir = ~/.platformio-dock/build/dock

[env:dock]
; Native ESP-IDF (5.4.1 on pioarduino 54.03.20), no Arduino. sdkconfig.defaults keeps what Espressif's prebuilt
; "high_perf" Arduino libraries gave the RGB panel (XIP from PSRAM, 64-byte data cache lines: their fix for panel
; drift while flash is written) and moves mbedTLS, mDNS and the httpd stack to PSRAM.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.flash_mode = qio
board_build.partitions = partitions.csv
board_build.f_flash = 80000000L
build_flags =
  -std=gnu++17
  -O2
  -I../   ; firmware/, for secrets.h (git-ignored). Keep the log level at ERROR (sdkconfig.defaults): esp_http_client's debug logs print URLs, with the API keys
build_unflags =
  -std=gnu++11
  -std=gnu++2b
  -Os
lib_extra_dirs = ../lib
monitor_speed = 115200

; The dock performance analysis (docs/superpowers/specs/2026-11-12-dock-performance-analysis-design.md): the dock build
; plus the perf logger and the stress test (serial "S"). tools/dock_perf_run.py flashes and runs it.
[env:perf]
extends = env:dock
build_flags =
  ${env:dock.build_flags}
  -DPERF_LOG
