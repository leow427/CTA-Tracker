; The dock on the Waveshare ESP32-S3-Touch-LCD-4.3 (ESP32-S3-WROOM-1-N8R8: 8 MB flash, 8 MB octal PSRAM): the
; mockup's screens (docs/ideas/2026-11-11-dock-ui-mockup.html) in portrait, live CTA data over Wi-Fi, and the 3 LED
; rows. Needs firmware/secrets.h (git-ignored) with the CTA keys and DOCK_WIFI_SSID / DOCK_WIFI_PASS.
; Build and flash: pio run -t upload; serial on the board's UART port (CH343) at 115200. Laptop previews: see
; tools/preview.cpp.
[platformio]
default_envs = dock
; The dock's pinned core (below) lives in its own PlatformIO folder: in the shared one it would replace the handheld's.
core_dir = ~/.platformio-dock

[env:dock]
; Pinned to arduino-esp32 3.2.0 with Espressif's prebuilt "high_perf" SDK libraries (esp-arduino-libs/arduino-esp32-sdk):
; XIP from PSRAM and 64-byte data cache lines. That is Espressif's fix for RGB panel drift and tearing on the ESP32-S3
; (ESP32_Display_Panel, docs/envs/use_with_arduino.md, "Solution for screen drift issue"): the stock core stalls the
; bounce-buffer refill whenever flash is written or the cache is busy. The libraries must match the core version, and
; 3.2.0 is the newest high_perf release, so the dock stays on it. The handheld's QSPI AMOLED keeps its own frame memory
; and stays on the stock core.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
platform_packages =
  platformio/framework-arduinoespressif32-libs@https://dl.espressif.com/AE/esp-arduino-libs/esp32-3.2.0-h.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
build_flags =
  -std=gnu++17
  -O2
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=0   ; serial on the UART port (CH343)
  -I../   ; firmware/, for secrets.h (git-ignored). Keep CORE_DEBUG_LEVEL below 4: HTTPClient's debug logs print URLs, with the API keys
build_unflags =
  -std=gnu++11
  -Os
lib_extra_dirs = ../lib
lib_deps =
  bblanchon/ArduinoJson@^7
monitor_speed = 115200
build_src_filter = +<*>

; The dock performance analysis (docs/superpowers/specs/2026-11-12-dock-performance-analysis-design.md): the dock build
; plus the perf logger and the stress test (serial "S"). tools/dock_perf_run.py flashes and runs it.
[env:perf]
extends = env:dock
build_flags =
  ${env:dock.build_flags}
  -DPERF_LOG
