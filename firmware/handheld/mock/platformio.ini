; The handheld mock: the real screens and gestures (spec 8.1, docs/handheld-ui.md) on the Waveshare 1.75" round
; AMOLED, fed by preset nearby stops and a fixed location (src/mock_data.*) instead of BLE and Wi-Fi.
; Build and flash: pio run -t upload. Laptop previews: see tools/preview.cpp.
[env:mock]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
build_flags =
  -std=gnu++17
  -O2
  -fno-math-errno   ; sqrtf as an instruction sequence, not a libm call
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
build_unflags =
  -std=gnu++11
  -Os   ; the framework adds it after build_flags, so it would override -O2 (drawing ran several times slower)
lib_extra_dirs = ../../lib
lib_deps =
  bblanchon/ArduinoJson@^7
  moononournation/GFX Library for Arduino@1.6.9
  lewisxhe/SensorLib@0.3.1
monitor_speed = 115200
