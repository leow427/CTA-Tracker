; The handheld on the Waveshare 1.75" round AMOLED: the real screens and gestures (spec 8.1, docs/handheld-ui.md).
;   env:live  (default) live CTA arrivals, alerts, and weather over Wi-Fi, for the nearby list sent from the
;             laptop (tools/send_nearby.py); needs firmware/secrets.h with the CTA keys and WIFI_SSID / WIFI_PASS.
;   env:power the live build plus the power analysis logger and stress test (POWER_LOG; serial "S" starts a run),
;             docs/superpowers/specs/2026-11-09-handheld-power-analysis-design.md. Run with tools/power_run.py.
;   env:mock  simulated arrivals around a fixed location (src/mock_data.*), no network.
; Native ESP-IDF 5.4.1, no Arduino (docs/superpowers/plans/2026-11-14-esp-idf-port.md): sdkconfig.defaults holds the
; SDK settings, src/idf_component.yml the display driver and mDNS. The live-only sources guard themselves with
; #ifdef HANDHELD_LIVE / POWER_LOG.
; Build and flash: pio run -t upload --upload-port <port> (or -e mock). Laptop previews: see tools/preview.cpp.
; Use ~/.platformio/penv/bin/pio: the pinned platform runs `python -m pip`, and Homebrew's Python has no pip.
[platformio]
default_envs = live
; The dock's PlatformIO folder, shared: the same pinned platform installed once.
core_dir = ~/.platformio-dock
; Outside the repo, one folder per checkout (PROJECT_HASH: the folder name and a hash of its path): ESP-IDF's
; build refuses a build path with a space in it, and the project folder has one.
build_dir = ~/.platformio-dock/build/${PROJECT_HASH}

[env:mock]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.f_flash = 80000000L
build_flags =
  -std=gnu++17
  -O2
  -fno-math-errno   ; sqrtf as an instruction sequence, not a libm call
build_unflags =
  -std=gnu++11
  -Os
lib_extra_dirs = ../../lib
monitor_speed = 115200

[env:live]
extends = env:mock
build_flags =
  ${env:mock.build_flags}
  -DHANDHELD_LIVE   ; keep the log level at ERROR (sdkconfig.defaults): esp_http_client's debug logs print URLs, with the API keys
  -I../..   ; firmware/, for secrets.h (git-ignored)

[env:power]
extends = env:live
build_flags =
  ${env:live.build_flags}
  -DPOWER_LOG
