; The handheld on the Waveshare 1.75" round AMOLED: the real screens and gestures (spec 8.1, docs/handheld-ui.md).
;   env:live  (default) live CTA arrivals, alerts, and weather over Wi-Fi, for the nearby list sent from the
;             laptop (tools/send_nearby.py); needs firmware/secrets.h with the CTA keys and WIFI_SSID / WIFI_PASS.
;   env:power the live build plus the power analysis logger and stress test (POWER_LOG; serial "S" starts a run),
;             docs/superpowers/specs/2026-11-09-handheld-power-analysis-design.md. Run with tools/power_run.py.
;   env:mock  simulated arrivals around a fixed location (src/mock_data.*), no network.
; Build and flash: pio run -t upload (or -e mock). Laptop previews: see tools/preview.cpp.
; Use ~/.platformio/penv/bin/pio: the pinned platform runs `python -m pip`, and Homebrew's Python has no pip.
[platformio]
default_envs = live
; The dock's PlatformIO folder, shared: the same pinned core (below) installed once, and the shared ~/.platformio
; keeps its own core.
core_dir = ~/.platformio-dock

[env:mock]
; The dock's pin (firmware/dock/platformio.ini, spec 11: both boards on one core): arduino-esp32 3.2.0 (ESP-IDF
; 5.4.1) with Espressif's prebuilt "high_perf" SDK libraries: an -O2 SDK, code and read-only data run from PSRAM
; (XIP), and 64-byte data cache lines.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
platform_packages =
  platformio/framework-arduinoespressif32-libs@https://dl.espressif.com/AE/esp-arduino-libs/esp32-3.2.0-h.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
build_flags =
  -std=gnu++17
  -O2
  -fno-math-errno   ; sqrtf as an instruction sequence, not a libm call
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
build_unflags =
  -std=gnu++11
  -Os   ; the framework adds it after build_flags, so it would override -O2 (drawing ran several times slower)
lib_extra_dirs = ../../lib
lib_deps =
  bblanchon/ArduinoJson@^7
  moononournation/GFX Library for Arduino@1.6.9
  lewisxhe/SensorLib@0.3.1
monitor_speed = 115200
build_src_filter = +<*> -<live.cpp> -<live_model.cpp> -<power.cpp>

[env:live]
extends = env:mock
build_flags =
  ${env:mock.build_flags}
  -DHANDHELD_LIVE   ; keep CORE_DEBUG_LEVEL below 4: HTTPClient's debug logs print URLs, with the API keys
  -I../..   ; firmware/, for secrets.h (git-ignored)
lib_deps =
  ${env:mock.lib_deps}
  lewisxhe/XPowersLib@0.3.3
build_src_filter = +<*>

[env:power]
extends = env:live
build_flags =
  ${env:live.build_flags}
  -DPOWER_LOG
